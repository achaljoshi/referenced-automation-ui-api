# ============================================================================
# cucumber-junit-platform-engine configuration for this repo's own
# self-verification suite (src/test). Consuming projects that import this
# jar will have their own junit-platform.properties with their own feature
# location and an extended glue path - see README.md "Using this as a
# dependency".
# ============================================================================

# Every scenario in this repo is inherently hybrid (UI + API), so - unlike
# referenced-automation-sap, which tag-scopes two mutually exclusive
# technologies - both untagged Hooks classes simply run for every scenario:
#  - com.company.automation.hooks           referenced-automation-ui's Hooks
#                                            (Playwright browser/context/page lifecycle)
#  - com.company.automation.api.hooks       referenced-automation-api's ApiHooks
#                                            (APIRequestContext lifecycle)
#  - com.company.automation.uiapi.stepdefinitions   this repo's own demo glue
cucumber.glue=com.company.automation.hooks,com.company.automation.api.hooks,com.company.automation.uiapi.stepdefinitions

# Plugin chain - StepLoggerPlugin/ExtentCucumberAdapter/AllureCucumber7Jvm use
# referenced-automation-ui's copy specifically (one canonical choice, even
# though referenced-automation-api ships its own identical duplicate class -
# see README "Resolving the resource collisions" for why only one is wired
# in here).
cucumber.plugin=pretty, \
  summary, \
  json:target/cucumber-reports/cucumber.json, \
  junit:target/cucumber-reports/cucumber.xml, \
  rerun:target/cucumber-reports/rerun.txt, \
  com.company.automation.reporting.StepLoggerPlugin, \
  com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:, \
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

cucumber.publish.quiet=true

# ----------------------------------------------------------------------------
# Parallel execution - safe here: referenced-automation-ui's Hooks and
# referenced-automation-api's ApiHooks each manage their own independent
# ThreadLocal-held resources (PlaywrightManager / ApiContextManager), so a
# fresh browser+context+page AND a fresh APIRequestContext are created per
# scenario per thread, same as running either framework standalone.
# ----------------------------------------------------------------------------
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=2
cucumber.execution.execution-mode.feature=concurrent

# ----------------------------------------------------------------------------
# Retry logic - identical rerun-file pattern to the rest of this framework
# family (see referenced-automation-ui's junit-platform.properties for the
# full rationale).
# ----------------------------------------------------------------------------
