# ============================================================================
# This is a MERGED config.properties - see README "Resolving the resource
# collisions" for why it exists. Both referenced-automation-ui's ConfigReader
# (com.company.automation.config.ConfigReader) and referenced-automation-api's
# ConfigReader (com.company.automation.api.config.ConfigReader) look up a
# classpath resource at this exact same path, "config/config.properties" -
# each dependency jar ships its own copy of that path, and only ONE of them
# would be found by the classloader if this repo did not also ship its own
# copy. Because Maven (and IntelliJ) always place a project's own
# target/classes ahead of its dependency jars on the runtime classpath, THIS
# file - not either dependency's bundled copy - is what both ConfigReader
# classes actually read when running this repo's own suite.
#
# This file is therefore a deliberate MERGE of both frameworks' keys.
# ============================================================================

# ---- referenced-automation-ui keys (com.company.automation.config.ConfigReader) ----
browser=chromium
headless=true
slow.mo.millis=0
remote.ws.endpoint=
viewport.width=1920
viewport.height=1080
record.video=false
trace.enabled=false
explicit.wait.seconds=15
pageload.timeout.seconds=30

# ---- referenced-automation-api keys (com.company.automation.api.config.ConfigReader) ----
# IMPORTANT: base.url below is read by referenced-automation-api's ConfigReader
# for the JSONPlaceholder API base URL. referenced-automation-ui's ConfigReader
# ALSO reads a key literally named "base.url" (for the web app under test's
# URL, defaulting to SauceDemo) - the two frameworks happen to use the exact
# same property name for two different concepts. Since this repo's sample
# suite targets TWO different demo applications (SauceDemo for UI, JSONPlaceholder
# for API), one shared "base.url" key cannot correctly serve both meanings at
# once. Resolution: this repo's own page objects (see
# com.company.automation.uiapi.pages.SauceLoginPage) hardcode their target URL
# directly instead of calling ui's ConfigReader.baseUrl() - so the "base.url"
# key below is unambiguously the API framework's meaning only. See README
# "Resolving the resource collisions" for the full explanation.
base.url=https://jsonplaceholder.typicode.com
api.timeout.seconds=30
api.ignore.https.errors=false
api.log.all.exchanges=false
