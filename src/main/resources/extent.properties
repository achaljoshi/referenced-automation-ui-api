# ============================================================================
# Own copy for the same reason config/config.properties is a merged file in
# this repo - see README "Resolving the resource collisions". Both
# referenced-automation-ui and referenced-automation-api ship an
# extent.properties at this exact classpath root; this repo's own copy is
# what deterministically wins since target/classes precedes dependency jars.
# ============================================================================

extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-report/ExtentSparkReport.html
extent.reporter.spark.config=extent-spark-config.xml

screenshot.dir=target/screenshots/
screenshot.rel.path=../screenshots/
