# ============================================================================
# GitLab CI pipeline for the Referenced Automation UI+API Composition Framework.
#
# Stages:
#   dependencies - build+install referenced-automation-utils, referenced-automation-ui
#                  AND referenced-automation-api locally (see note below)
#   build        - compile the framework + sample suite
#   test         - run the hybrid Cucumber scenarios headless, retry only what failed
#   report       - publish Cucumber/Extent/Allure artifacts (always, even on failure)
#   deploy       - `mvn deploy` the framework jar to Nexus (main branch / tags only)
#
# NOTE on the "dependencies" stage: this framework depends on all three other
# repos in this family, none of which is yet published to this org's Nexus.
# Until they are, this stage clones and `mvn install`s each into the shared
# .m2 cache so `test`/`deploy` can resolve them like any other dependency.
# Once all three are published to Nexus, delete this stage.
# ============================================================================

image: maven:3.9-eclipse-temurin-17

stages:
  - dependencies
  - build
  - test
  - report
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"
  RERUN_FILE: "target/cucumber-reports/rerun.txt"
  UTILS_REPO_URL: "https://github.com/achaljoshi/referenced-automation-utils.git"
  UI_REPO_URL: "https://github.com/achaljoshi/referenced-automation-ui.git"
  API_REPO_URL: "https://github.com/achaljoshi/referenced-automation-api.git"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

cache:
  key: "$CI_COMMIT_REF_SLUG-m2-playwright"
  paths:
    - .m2/repository
    - .cache/ms-playwright

install-dependencies:
  stage: dependencies
  script:
    - git clone --depth 1 "$UTILS_REPO_URL" /tmp/referenced-automation-utils
    - cd /tmp/referenced-automation-utils && ./mvnw $MAVEN_CLI_OPTS -DskipTests install && cd -
    - git clone --depth 1 "$UI_REPO_URL" /tmp/referenced-automation-ui
    - cd /tmp/referenced-automation-ui && ./mvnw $MAVEN_CLI_OPTS -DskipTests install && cd -
    - git clone --depth 1 "$API_REPO_URL" /tmp/referenced-automation-api
    - cd /tmp/referenced-automation-api && ./mvnw $MAVEN_CLI_OPTS -DskipTests install && cd -

build:
  stage: build
  needs: ["install-dependencies"]
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean compile test-compile
  artifacts:
    paths:
      - target/classes
      - target/test-classes
    expire_in: 1 hour

.playwright_setup: &playwright_setup
  - ./mvnw $MAVEN_CLI_OPTS exec:java@install-playwright-browsers

test:
  stage: test
  needs: ["build"]
  before_script:
    - *playwright_setup
  script:
    - rm -f "$RERUN_FILE"
    - ./mvnw $MAVEN_CLI_OPTS test -Dbrowser=chromium -Dheadless=true -Denv=qa || true
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "== Retrying failed scenarios =="
        cat "$RERUN_FILE"
        ./mvnw $MAVEN_CLI_OPTS test \
          -Dbrowser=chromium -Dheadless=true -Denv=qa \
          -Dcucumber.features="@$RERUN_FILE" || true
      fi
    - |
      if [ -s "$RERUN_FILE" ]; then
        echo "Scenarios still failing after retry:"
        cat "$RERUN_FILE"
        exit 1
      fi
      echo "All scenarios passed (first attempt or after retry)."
  artifacts:
    when: always
    paths:
      - target/cucumber-reports/
      - target/extent-report/
      - target/allure-results/
      - target/screenshots/
      - target/auth/
      - logs/
    reports:
      junit: target/cucumber-reports/cucumber.xml
    expire_in: 30 days

pages:
  stage: report
  image: node:20-slim
  needs: ["test"]
  script:
    - npm install -g allure-commandline --silent
    - allure generate target/allure-results --clean -o public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  stage: deploy
  needs: ["test"]
  script:
    - |
      cat > ci-settings.xml <<EOF
      <settings>
        <servers>
          <server><id>nexus-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
          <server><id>nexus-snapshots</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server>
        </servers>
      </settings>
      EOF
    - ./mvnw $MAVEN_CLI_OPTS -s ci-settings.xml -DskipTests deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
